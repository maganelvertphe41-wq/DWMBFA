<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D.W.M. BRUTE-FORCE ATTACK</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <style>
      body {
        margin: 0;
        background-color: #0a0a0a;
      }
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        background-image: linear-gradient(to right, rgba(128,128,128,0.07) 1px, transparent 1px), linear-gradient(to bottom, rgba(128,128,128,0.07) 1px, transparent 1px);
        background-size: 24px 24px;
        z-index: 9999;
      }
      .glitch-wrapper {
        position: relative;
        font-family: monospace;
      }
      .glitch-text {
        position: relative;
        color: #c084fc;
        font-weight: bold;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 1.5rem;
        filter: drop-shadow(0 0 10px rgba(168,85,247,0.8));
      }
      @media (min-width: 640px) {
        .glitch-text {
          font-size: 2rem;
        }
      }
      .glitch-text::before, .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        pointer-events: none;
      }
      .glitch-text::before {
        left: 2px;
        text-shadow: -2px 0 #10b981;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 3s infinite linear alternate-reverse;
      }
      .glitch-text::after {
        left: -2px;
        text-shadow: -2px 0 #f43f5e, 2px 2px #c084fc;
        animation: glitch-anim2 2.5s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim {
        0% { clip: rect(11px, 9999px, 81px, 0); }
        5% { clip: rect(48px, 9999px, 12px, 0); }
        10% { clip: rect(24px, 9999px, 83px, 0); }
        15% { clip: rect(61px, 9999px, 11px, 0); }
        20% { clip: rect(4px, 9999px, 60px, 0); }
        25% { clip: rect(81px, 9999px, 19px, 0); }
        30% { clip: rect(27px, 9999px, 9px, 0); }
        35% { clip: rect(4px, 9999px, 7px, 0); }
        40% { clip: rect(43px, 9999px, 70px, 0); }
        45% { clip: rect(20px, 9999px, 47px, 0); }
        50% { clip: rect(31px, 9999px, 29px, 0); }
        55% { clip: rect(79px, 9999px, 50px, 0); }
        60% { clip: rect(48px, 9999px, 46px, 0); }
        65% { clip: rect(15px, 9999px, 97px, 0); }
        70% { clip: rect(3px, 9999px, 8px, 0); }
        75% { clip: rect(78px, 9999px, 18px, 0); }
        80% { clip: rect(51px, 9999px, 96px, 0); }
        85% { clip: rect(68px, 9999px, 84px, 0); }
        90% { clip: rect(19px, 9999px, 63px, 0); }
        95% { clip: rect(76px, 9999px, 69px, 0); }
        100% { clip: rect(62px, 9999px, 20px, 0); }
      }
      @keyframes glitch-anim2 {
        0% { clip: rect(65px, 9999px, 100px, 0); }
        5% { clip: rect(52px, 9999px, 74px, 0); }
        10% { clip: rect(79px, 9999px, 85px, 0); }
        15% { clip: rect(75px, 9999px, 5px, 0); }
        20% { clip: rect(67px, 9999px, 61px, 0); }
        25% { clip: rect(14px, 9999px, 79px, 0); }
        30% { clip: rect(1px, 9999px, 66px, 0); }
        35% { clip: rect(86px, 9999px, 30px, 0); }
        40% { clip: rect(23px, 9999px, 98px, 0); }
        45% { clip: rect(85px, 9999px, 72px, 0); }
        50% { clip: rect(71px, 9999px, 75px, 0); }
        55% { clip: rect(2px, 9999px, 48px, 0); }
        60% { clip: rect(30px, 9999px, 16px, 0); }
        65% { clip: rect(59px, 9999px, 50px, 0); }
        70% { clip: rect(41px, 9999px, 62px, 0); }
        75% { clip: rect(2px, 9999px, 82px, 0); }
        80% { clip: rect(47px, 9999px, 73px, 0); }
        85% { clip: rect(3px, 9999px, 27px, 0); }
        90% { clip: rect(26px, 9999px, 55px, 0); }
        95% { clip: rect(42px, 9999px, 97px, 0); }
        100% { clip: rect(38px, 9999px, 49px, 0); }
      }
      .booting-text {
        color: #10b981;
        font-family: monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        font-weight: bold;
        margin-top: 1rem;
        display: flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
      }
      .booting-dot {
        width: 6px;
        height: 6px;
        background-color: #10b981;
        border-radius: 50%;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        box-shadow: 0 0 8px rgba(16,185,129,0.8);
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="glitch-wrapper">
          <h1 class="glitch-text" data-text="D.W.M. BRUTE-FORCE ATTACK">
            D.W.M. BRUTE-FORCE ATTACK
          </h1>
        </div>
        <div class="booting-text">
          <span class="booting-dot"></span>
          Initializing System...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
